plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.handtracker'
version = '0.1.0'

android {
  namespace "expo.modules.handtracker"
  compileSdk 34
  defaultConfig {
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'com.google.mediapipe:tasks-vision:0.10.35'
}
