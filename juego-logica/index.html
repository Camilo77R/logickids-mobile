    <style>
      /* Critical CSS for initial load */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
      }

      #app {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .initial-loading {
        text-align: center;
      }

      .initial-loading h1 {
        font-size: 24px;
        font-weight: 300;
        letter-spacing: 2px;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #ffa575 0%, #311599 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #ffa575;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <div id="app">
      <!-- Initial loading state (replaced by JS) -->
      <div class="initial-loading">

        <p style="margin-top: 20px; opacity: 0.6; font-size: 14px">Cargando interfaz táctil sin contacto...</p>
